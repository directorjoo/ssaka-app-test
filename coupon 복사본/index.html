<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8f5"><title>매장 쿠폰 | 싸카</title><style>
:root{color-scheme:light;--ink:#202720;--muted:#6c756d;--line:#e5e9e3;--green:#28533d;--bg:#f7f8f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:620px;margin:auto;padding:22px 16px 48px}.brand{font-size:11px;letter-spacing:.16em;font-weight:900;color:var(--green)}header{padding:12px 0 18px}.shop{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden}.hero{width:100%;max-height:230px;object-fit:cover;display:block}.intro{padding:18px}.intro h1{font-size:23px;margin:0 0 7px}.muted{color:var(--muted);font-size:13px;line-height:1.6}.coupons{display:grid;gap:12px;margin-top:18px}.coupon{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;position:relative}.coupon h2{font-size:17px;margin:0 0 7px}.discount{font-size:25px;font-weight:900;color:var(--green);margin:9px 0}.code{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f4f7f2;border:1px dashed #b8c8b8;padding:11px 12px;border-radius:10px;margin-top:13px}.code b{font-size:17px;letter-spacing:.08em}.btn{border:0;border-radius:9px;background:var(--green);color:#fff;font-weight:800;padding:10px 13px;cursor:pointer}.share{width:100%;margin-top:16px;padding:14px}.empty,.error{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;color:var(--muted);font-size:14px}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:22px}
</style></head><body><main class="wrap"><header><div class="brand">SSAKA · COUPON</div></header><section class="shop"><img id="hero" class="hero" hidden alt="매장 대표 사진"><div class="intro"><h1 id="shopName">쿠폰을 불러오는 중입니다</h1><div class="muted" id="shopDesc"></div><div class="muted" id="shopAddress" style="margin-top:5px"></div></div></section><section id="coupons" class="coupons" aria-live="polite"></section><button id="share" class="btn share" hidden>이 쿠폰 페이지 공유하기</button><div class="foot">쿠폰 사용 전 매장 직원에게 코드를 제시해 주세요. 할인 조건과 사용 가능 여부는 매장에서 확인합니다.<br>Powered by SSAKA</div></main><script>
(function(){'use strict';const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),shopKey=(params.get('shop_key')||'').slice(0,100);const text=(tag,cls,value)=>{const n=document.createElement(tag);if(cls)n.className=cls;n.textContent=value||'';return n};function message(s,cls='empty'){$('coupons').replaceChildren(text('div',cls,s))}async function copy(value){try{await navigator.clipboard.writeText(value);return true}catch(_){const t=document.createElement('textarea');t.value=value;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();return ok}}
async function init(){if(!shopKey){$('shopName').textContent='매장 정보를 찾을 수 없습니다';message('공유받은 쿠폰 링크를 다시 확인해 주세요.');return}try{const res=await fetch('/api/public/shops/'+encodeURIComponent(shopKey),{headers:{accept:'application/json'}});const data=await res.json();if(!res.ok)throw new Error('매장 정보를 불러오지 못했습니다.');const s=data.shop||{};$('shopName').textContent=s.name||'매장 쿠폰';$('shopDesc').textContent=s.description||'';$('shopAddress').textContent=s.address||'';if(s.image_url&&/^https:\/\//i.test(s.image_url)){$('hero').src=s.image_url;$('hero').hidden=false}const list=data.coupons||[];if(!list.length){message('현재 사용 가능한 쿠폰이 없습니다.');return}$('coupons').replaceChildren();list.forEach(c=>{const card=text('article','coupon'),title=text('h2','',c.title),desc=text('p','muted',c.description||'');card.append(title,desc);const discount=text('div','discount',c.discount_type==='percent'?`${c.discount_value}% 할인`:`${Number(c.discount_value).toLocaleString('ko-KR')}원 할인`);card.appendChild(discount);const terms=[];if(c.min_order)terms.push(`최소 주문 ${Number(c.min_order).toLocaleString('ko-KR')}원`);if(c.ends_at)terms.push(`종료 ${new Date(c.ends_at).toLocaleDateString('ko-KR')}`);card.appendChild(text('div','muted',terms.join(' · ')||'매장 직원에게 쿠폰 코드를 보여주세요.'));const code=text('b','',c.code),btn=text('button','btn','코드 복사');btn.type='button';btn.addEventListener('click',async()=>{btn.textContent=await copy(c.code)?'복사 완료':'코드: '+c.code});const row=text('div','code','');row.append(code,btn);card.appendChild(row);$('coupons').appendChild(card)});$('share').hidden=false;$('share').addEventListener('click',async()=>{const payload={title:`${s.name||'매장'} 쿠폰`,text:`${s.name||'매장'}에서 사용할 수 있는 쿠폰을 확인해 보세요.`,url:location.href};if(navigator.share){try{await navigator.share(payload)}catch(_){}}else{const ok=await copy(location.href);$('share').textContent=ok?'링크를 복사했습니다':'주소창 링크를 복사해 주세요'}})}catch(e){$('shopName').textContent='쿠폰 페이지';message(e.message,'error')}}init()})();
</script></body></html>
