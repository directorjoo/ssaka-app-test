<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>싸카 결제 확인</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#f5f6f3;color:#20231f;margin:0}.box{max-width:520px;margin:12vh auto;padding:26px;background:white;border:1px solid #e5e8e2;border-radius:18px}h1{font-size:22px}.muted{color:#737a72;line-height:1.7;font-size:14px}</style></head><body><main class="box"><h1 id="title">결제 승인 확인 중</h1><p id="msg" class="muted">결제 결과를 서버에서 검증하고 있습니다. 창을 닫지 마세요.</p></main><script>
(async()=>{const p=new URLSearchParams(location.search),shop=sessionStorage.getItem('ssaka_billing_shop'),admin=sessionStorage.getItem('ssaka_billing_admin');const paymentKey=p.get('paymentKey'),orderId=p.get('orderId'),amount=Number(p.get('amount'));try{if(!shop||!admin||!paymentKey||!orderId||!Number.isSafeInteger(amount))throw Error('결제 정보를 확인할 수 없습니다. 매장 관리자 화면에서 다시 확인해 주세요.');const r=await fetch('/api/billing/confirm',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({shop_key:shop,admin_key:admin,paymentKey,orderId,amount})});const d=await r.json();if(!r.ok)throw Error(d.message||d.error||'결제 승인 확인에 실패했습니다.');document.getElementById('title').textContent='이용권 활성화 완료';document.getElementById('msg').textContent=`${d.plan_code.toUpperCase()} 이용권이 활성화되었습니다. ${new Date(d.current_period_end).toLocaleDateString('ko-KR')}까지 이용할 수 있습니다. 자동 정기결제는 지원하지 않으므로 만료 전 재구매해 주세요.`}catch(e){document.getElementById('title').textContent='결제 확인 필요';document.getElementById('msg').textContent=e.message}finally{sessionStorage.removeItem('ssaka_billing_shop');sessionStorage.removeItem('ssaka_billing_admin')}})();
</script></body></html>
