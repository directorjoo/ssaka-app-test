<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>싸카 결제 실패</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#f5f6f3;color:#20231f;margin:0}.box{max-width:520px;margin:12vh auto;padding:26px;background:white;border:1px solid #e5e8e2;border-radius:18px}.muted{color:#737a72;line-height:1.7}</style></head><body><main class="box"><h1>결제가 완료되지 않았습니다.</h1><p class="muted" id="msg"></p><a href="/billing/">다시 시도하기</a></main><script>const p=new URLSearchParams(location.search);document.getElementById('msg').textContent=[p.get('message'),p.get('code')].filter(Boolean).join(' · ')||'결제가 취소되었거나 승인되지 않았습니다.';</script></body></html>
