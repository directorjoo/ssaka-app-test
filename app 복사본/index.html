<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#FFFFFF">
  <title>싸바</title>
  <meta property="og:title" content="싸바 — 앱 없이 카톡 하나로">
  <meta property="og:description" content="명함 · 가게 홍보 · 모임 공지 · 초대장을 10초 만에">
  <meta property="og:image" content="https://sava.kr/img/ssaka-share.png?v=5">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../img/favicon.png?v=2">
  <link rel="apple-touch-icon" href="../img/apple-touch-icon.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="싸바">
  <link rel="stylesheet" href="../css/brand.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
    body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
    button { font: inherit; color: inherit; }
    a { color: inherit; }
    .shell { max-width: 560px; margin: 0 auto; }

    /* 상단 */
    .top { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    .top-in { display: flex; align-items: center; justify-content: space-between; height: 58px; padding: 0 18px; padding-top: env(safe-area-inset-top); }
    .top h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo svg { width: 30px; height: 30px; }
    .top-act { display: flex; gap: 4px; }
    .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; border-radius: 12px; cursor: pointer; text-decoration: none; }
    .icon-btn svg, .tab svg, .row-act svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* 화면 */
    .view[hidden] { display: none; }
    .sec { padding: 6px 0 4px; }
    .sec-h { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 18px 8px; }
    .sec-h h2 { margin: 0; font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
    .sec-h a, .sec-h button { font-size: 13.5px; color: var(--ssaka-deep); text-decoration: none; border: 0; background: none; cursor: pointer; font-weight: 700; padding: 6px 0; }
    .divider { height: 8px; background: var(--bg-2); margin: 6px 0; }

    /* 목록 행 (카톡 친구/채팅 목록처럼) */
    .row { display: flex; align-items: center; gap: 14px; padding: 10px 18px; text-decoration: none; min-height: 72px; }
    .row:active { background: var(--bg-2); }
    .ava { flex: none; width: 50px; height: 50px; border-radius: 19px; overflow: hidden; display: grid; place-items: center; font-weight: 800; font-size: 20px; color: #fff; background: var(--ssaka); }
    .ava img { width: 100%; height: 100%; object-fit: cover; }
    .row.me { padding-top: 14px; padding-bottom: 14px; }
    .row.me .ava { width: 64px; height: 64px; border-radius: 24px; font-size: 26px; }
    .row-txt { min-width: 0; flex: 1; display: grid; gap: 3px; }
    .row-t { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row.me .row-t { font-size: 18px; }
    .row-s { font-size: 13.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-r { flex: none; display: grid; justify-items: end; gap: 6px; font-size: 12px; color: var(--ink-2); }
    .new { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--ssaka); color: #fff; font-size: 11.5px; font-weight: 800; display: grid; place-items: center; }
    .row-r { display: flex; gap: 6px; align-items: center; }
    .row-act { width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: var(--ssaka-soft); color: var(--ssaka-deep); border-radius: 12px; cursor: pointer; }
    .tag { display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--bg-2); color: var(--ink-2); }
    .tag.ok { background: var(--ssaka-soft); color: var(--ssaka-deep); }
    .tag.off { text-decoration: line-through; }

    /* 첫 화면 안내 */
    .hero { margin: 8px 18px 6px; padding: 20px 20px 18px; border-radius: 22px; background: var(--ssaka-soft); color: var(--ssaka-deep); position: relative; overflow: hidden; }
    .hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 170px; height: 170px; border-radius: 50%; background: rgba(255,255,255,.5); }
    .hero b { display: block; font-size: 22px; line-height: 1.3; letter-spacing: -0.02em; position: relative; z-index: 1; }
    .hero p { margin: 8px 0 16px; font-size: 14.5px; opacity: .95; position: relative; z-index: 1; }
    .hero a { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 6px; min-height: 46px; padding: 0 18px; border-radius: 999px; background: var(--ssaka); color: #fff; font-weight: 800; text-decoration: none; }

    /* 어디야? 바로가기 */
    .inst { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
    .inst-box { width: 100%; max-width: 480px; background: #fff; border-radius: 24px 24px 0 0; padding: 26px 22px calc(22px + env(safe-area-inset-bottom)); }
    .inst-box img { width: 72px; height: 72px; border-radius: 18px; display: block; }
    .inst-box h2 { margin: 14px 0 6px; font-size: 22px; }
    .inst-box p { margin: 0 0 14px; color: var(--ink-2); font-size: 15px; line-height: 1.55; }
    .inst-box ol { margin: 0 0 16px; padding-left: 20px; font-size: 16px; line-height: 1.8; }
    .inst-box .go { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 54px; border: 0; border-radius: 14px; background: var(--ssaka); color: #fff; font: inherit; font-size: 17px; font-weight: 800; text-decoration: none; cursor: pointer; }
    .inst-box .later { display: block; width: 100%; min-height: 46px; margin-top: 8px; border: 0; background: none; color: var(--ink-2); font: inherit; font-size: 15px; cursor: pointer; }
    .camp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 4px 18px 12px; }
    .camp a { position: relative; display: flex; flex-direction: column; min-height: 168px; padding: 16px 14px; border-radius: 20px; text-decoration: none; overflow: hidden; color: #1a1a1a; }
    .camp b { font-size: 17px; line-height: 1.3; letter-spacing: -0.02em; word-break: keep-all; }
    .camp span { margin-top: 6px; font-size: 13px; line-height: 1.4; opacity: .85; word-break: keep-all; }
    .camp i { position: absolute; right: 10px; bottom: 6px; font-style: normal; font-size: 52px; line-height: 1; }
    .camp a.dark { color: #fff; }
    .camp a:focus-visible, .svc button:focus-visible, .svc a:focus-visible { outline: 3px solid var(--ssaka); outline-offset: 2px; }
    .svc { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 4px; margin: 6px 14px 10px; padding: 18px 6px; background: #fff; border-radius: 22px; }
    .svc a, .svc button { position: relative; display: grid; justify-items: center; gap: 7px; padding: 4px 0; border: 0; background: none; font: inherit; font-size: 14px; font-weight: 700; color: var(--ink); text-decoration: none; cursor: pointer; word-break: keep-all; text-align: center; line-height: 1.25; }
    .svc i { font-style: normal; width: 50px; height: 50px; border-radius: 17px; display: grid; place-items: center; font-size: 25px; background: var(--tint, var(--bg-2)); }
    .svc .soon i { filter: grayscale(.35); opacity: .75; }
    .svc em { position: absolute; top: -4px; right: 10%; font-style: normal; font-size: 10.5px; font-weight: 800; padding: 1px 6px; border-radius: 999px; background: var(--ssaka); color: #fff; }
    .svc-cap { margin: 2px 22px 0; font-size: 13.5px; color: var(--ink-2); }
    .eo-hero { position: relative; overflow: hidden; margin: 6px 18px 12px; padding: 22px 20px 18px; border-radius: 26px; background: linear-gradient(135deg, #C8162F 0%, #8E0F22 100%); color: #fff; box-shadow: 0 18px 36px -20px rgba(142,15,34,.9); }
    .eo-hero .pin { position: absolute; right: 14px; top: 8px; font-size: 76px; line-height: 1; filter: drop-shadow(0 8px 10px rgba(0,0,0,.25)); }
    .eo-hero h2 { margin: 0; font-size: 44px; line-height: 1.05; font-weight: 900; letter-spacing: -0.04em; }
    .eo-hero p { margin: 8px 0 16px; font-size: 15px; opacity: .95; word-break: keep-all; padding-right: 70px; }
    .eo-hero .eo-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .eo-hero .eo-btns a { display: grid; place-items: center; min-height: 64px; border-radius: 18px; background: #fff; color: #8E0F22; font-size: 18px; font-weight: 900; text-decoration: none; letter-spacing: -0.02em; line-height: 1.15; text-align: center; }
    .eo-hero .eo-btns a small { display: block; font-size: 12px; font-weight: 700; color: #9a5a63; letter-spacing: 0; }
    .eo-hero .eo-btns a.alt { background: rgba(255,255,255,.16); color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.6); }
    .eo-hero .eo-btns a.alt small { color: rgba(255,255,255,.85); }
    .eo-hero .eo-btns a.play { grid-column: 1 / -1; min-height: 62px; background: #FFE27A; color: #5a3b00; font-size: 20px; }
    .eo-hero .eo-btns a.play small { color: #7a5a10; }
    .eo-hero a:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .si-pad { padding: 0 18px; }
    .mk { position: relative; overflow: hidden; display: block; margin: 0 18px 12px; padding: 18px 18px 14px; border-radius: 26px; background: #B3132B; color: #fff; text-decoration: none; box-shadow: 0 18px 36px -20px rgba(142,10,28,.9); }
    .mk .kk { font-size: 12px; font-weight: 800; letter-spacing: .14em; opacity: .85; }
    .mk h2 { margin: 2px 0 0; font-size: 28px; line-height: 1.1; font-weight: 900; letter-spacing: -0.04em; }
    .mk p { margin: 8px 0 14px; font-size: 14.5px; line-height: 1.5; opacity: .95; word-break: keep-all; padding-right: 84px; }
    .mk .mini { position: absolute; right: 16px; top: 14px; width: 66px; height: 86px; border-radius: 14px; background: #fff; transform: rotate(8deg); box-shadow: 0 10px 22px rgba(0,0,0,.25); padding: 10px 9px; }
    .mk .mini::before { content: ""; display: block; width: 24px; height: 24px; border-radius: 50%; background: #FBE3E6 url(../img/cherry.svg) center/17px no-repeat; margin-bottom: 6px; }
    .mk .mini i { display: block; height: 7px; border-radius: 4px; background: #F1D4D8; margin-top: 6px; }
    .mk .mini i:nth-child(1) { width: 80%; background: #B3132B; }
    .mk .mini i:nth-child(3) { width: 60%; }
    .mk .kinds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .mk .kinds a { display: grid; place-items: center; min-height: 46px; border-radius: 14px; background: rgba(255,255,255,.16); color: #fff; text-decoration: none; font-size: 14px; font-weight: 800; line-height: 1.15; text-align: center; }
    .mk .go { display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 18px; background: #fff; color: #B3132B; font-size: 19px; font-weight: 900; text-decoration: none; letter-spacing: -0.02em; }
    .story { margin: 0 18px 12px; padding: 16px 16px 14px; border-radius: 22px; background: #FFF7E6; box-shadow: inset 0 0 0 1.5px #F3D9A4; }
    .story .st-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .story .st-top img { width: 46px; height: 46px; flex: none; }
    .story .st-top b { display: block; font-size: 20px; font-weight: 900; letter-spacing: -0.03em; color: #3a2a00; }
    .story .st-top span { font-size: 13.5px; color: #7a6230; word-break: keep-all; }
    .story .st-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .story .st-btns a, .story .st-btns button { display: grid; place-items: center; min-height: 54px; border: 0; border-radius: 15px; font: inherit; font-size: 16.5px; font-weight: 900; text-decoration: none; cursor: pointer; letter-spacing: -0.02em; }
    .story .st-btns a { background: #B3132B; color: #fff; }
    .story .st-btns button { background: #FEE500; color: #3a1d1d; }
    .play-h { margin: 6px 22px 8px; font-size: 15.5px; font-weight: 900; letter-spacing: -0.02em; color: var(--ssaka-deep, #8E0A1C); }
    .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 0 18px 14px; }
    .tile { display: grid; justify-items: center; align-content: center; gap: 3px; min-height: 98px; padding: 10px 4px; border-radius: 20px; text-decoration: none; text-align: center; }
    .tile i { font-style: normal; font-size: 30px; line-height: 1.1; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
    .tile i u { text-decoration: none; color: inherit; opacity: .8; }
    .tile b { font-size: 14.5px; font-weight: 900; letter-spacing: -0.03em; }
    .tile span { font-size: 11.5px; font-weight: 700; opacity: .8; }
    .tile.t1 { background: #B3132B; color: #fff; box-shadow: none; }
    .tile.t1 i { font-size: 24px; }
    .tile.t2 { background: #FFD84D; color: #1A1A1A; box-shadow: inset 0 0 0 2px #1A1A1A; }
    .tile.t4 { background: #1F5FAF; color: #fff; box-shadow: inset 0 0 0 3px #5A3420; }
    .tile.t3 { background: #fff; color: #B3132B; box-shadow: inset 0 0 0 2px #B3132B; }
    .eodiya { display: flex; align-items: center; gap: 14px; margin: 10px 18px 4px; padding: 16px; border-radius: 20px; background: var(--ssaka-soft); text-decoration: none; }
    .eodiya i { font-style: normal; width: 52px; height: 52px; border-radius: 18px; background: var(--ssaka); display: grid; place-items: center; font-size: 26px; flex: none; }
    .eodiya b { display: block; font-size: 19px; color: var(--ssaka-deep); letter-spacing: -0.02em; }
    .eodiya span { font-size: 13.5px; color: var(--ink-2); }
    .eodiya:focus-visible { outline: 3px solid var(--ssaka); outline-offset: 2px; }

    /* 업종 바로가기 */
    .grp { margin: 14px 22px 2px; font-size: 15.5px; font-weight: 900; letter-spacing: -0.02em; color: var(--ssaka-deep, #8E0A1C); }
    .inds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 6px; padding: 4px 12px 10px; }
    .ind { display: grid; justify-items: center; gap: 6px; padding: 10px 2px; border-radius: 14px; text-decoration: none; font-size: 15px; font-weight: 700; line-height: 1.25; color: var(--text, #1a1a1a); text-align: center; word-break: keep-all; }
    .ind:active { background: var(--bg-2); }
    .ind i { font-style: normal; width: 56px; height: 56px; border-radius: 20px; background: var(--tint, var(--bg-2)); display: grid; place-items: center; font-size: 28px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.06); }

    .empty { padding: 48px 24px; text-align: center; color: var(--ink-2); }
    .empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
    .empty a { display: inline-flex; margin-top: 16px; min-height: 48px; align-items: center; padding: 0 20px; border-radius: 999px; background: var(--ssaka); color: #fff; font-weight: 800; font-size: 16px; text-decoration: none; }

    .more a, .more button { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 56px; padding: 0 18px; border: 0; background: none; text-align: left; font-size: 16px; text-decoration: none; cursor: pointer; }
    .more a + a, .more a + button, .more button + a, .more button + button { border-top: 1px solid var(--line); }
    .more span { color: var(--ink-2); font-size: 13.5px; }
    .tip { margin: 6px 18px 0; padding: 14px 16px; border-radius: 16px; background: var(--bg-2); font-size: 14px; line-height: 1.6; color: var(--ink-2); }
    .tip b { color: var(--ink); }

    /* 하단 탭 (카톡처럼) */
    .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(255,255,255,.97); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    .tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: 64px; }
    .tab { display: grid; justify-items: center; align-content: center; gap: 3px; border: 0; background: none; cursor: pointer; color: #9a9a9a; font-size: 11px; font-weight: 600; text-decoration: none; position: relative; }
    .tab[aria-selected="true"] { color: var(--ink); }
    .tab[aria-selected="true"] svg { stroke-width: 2.2; }
    .tab .dot { position: absolute; top: 8px; left: 56%; width: 8px; height: 8px; border-radius: 50%; background: var(--ssaka); }
    .tab-make i { width: 48px; height: 48px; border-radius: 17px; background: var(--ssaka); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 18px -8px rgba(179,19,43,.8); margin-top: -10px; }
    .tab-make i svg { stroke-width: 2.4; }
    .tab-make { color: var(--ink); }
    .icon-btn:focus-visible, .tab:focus-visible, .row:focus-visible, .ind:focus-visible, .row-act:focus-visible { outline: 3px solid var(--ssaka); outline-offset: 2px; }

    .toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(10px); background: #1a1a1a; color: #fff; padding: 12px 18px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); z-index: 30; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="top-in">
      <div class="logo" id="topTitle">
        <img src="../img/cherry.svg" alt="" width="32" height="32" style="display:block">
        <h1>홈</h1>
      </div>
      <div class="top-act">
        <a class="icon-btn" href="../make/" aria-label="새 카드 만들기"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M12 9v6M9 12h6"/></svg></a>
      </div>
    </div>
  </header>

  <!-- 홈 -->
  <main class="view" id="v-home"></main>
  <!-- 받은 카드 -->
  <main class="view" id="v-inbox" hidden></main>
  <!-- 예약 -->
  <main class="view" id="v-resv" hidden></main>
  <!-- 더보기 -->
  <main class="view" id="v-more" hidden></main>
</div>

<nav class="tabs" aria-label="메뉴">
  <div class="tabs-in" role="tablist">
    <button class="tab" role="tab" data-v="home" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>홈</button>
    <button class="tab" role="tab" data-v="inbox" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-4 3v-3H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>받은 카드</button>
    <a class="tab tab-make" href="../make/"><i><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></i>만들기</a>
    <button class="tab" role="tab" data-v="resv" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>예약</button>
    <button class="tab" role="tab" data-v="more" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>더보기</button>
  </div>
</nav>
<div class="toast" id="toast" role="status"></div>

<script src="../js/designs.js"></script>
<script src="../js/store.js"></script>
<script src="../js/install.js"></script>
<script src="../js/share.js"></script>
<script>
(function () {
  var D = window.SsakaDesigns, S = window.SsakaStore;
  var $ = function (id) { return document.getElementById(id); };
  var TITLES = { home: '홈', inbox: '받은 카드', resv: '예약', more: '더보기' };
  var DAYS = ['일', '월', '화', '수', '목', '금', '토'];

  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 2000); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function when(ts) {
    if (!ts) return '';
    var d = new Date(ts), now = new Date();
    if (d.toDateString() === now.toDateString()) {
      var h = d.getHours(), m = d.getMinutes();
      return (h < 12 ? '오전 ' : '오후 ') + ((h % 12) || 12) + ':' + (m < 10 ? '0' : '') + m;
    }
    var y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return '어제';
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
  }

    ({ home: renderHome, inbox: renderInbox, resv: renderResv, more: renderMore })[name]();
    try { history.replaceState(null, '', name === 'home' ? location.pathname : '#' + name); } catch (e) {}
    window.scrollTo(0, 0);
  }
  function renderAll() { show(current); refreshDots(); }
  document.querySelectorAll('.tab[data-v]').forEach(function (t) { t.addEventListener('click', function () { current = t.dataset.v; show(current); }); });
  var wantInstall = /[?&]install=1/.test(location.search);
  var current = (location.hash || '').slice(1);
  if (!TITLES[current]) current = 'home';
  renderAll();

  // ---------- 싸바카드 설치하기 (홈 화면에 추가) ----------
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; var b = document.getElementById('instGo'); if (b) b.textContent = '📲 지금 설치하기'; });
  function installSheet() {
    if (window.SsakaInstall) return SsakaInstall.open();
    var ua = navigator.userAgent, inKakao = /KAKAOTALK/i.test(ua), ios = /iPhone|iPad|iPod/i.test(ua);
    var standalone = window.matchMedia && matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    var w = el('div', 'inst'); w.setAttribute('role', 'dialog'); w.setAttribute('aria-modal', 'true'); w.setAttribute('aria-label', '싸바카드 설치하기');
    var b = el('div', 'inst-box');
    var ic = el('img'); ic.src = '../img/icon-192.png'; ic.alt = ''; b.appendChild(ic);
    b.appendChild(el('h2', '', standalone ? '이미 설치되어 있어요 🍒' : '싸바카드 설치하기'));
    if (standalone) {
      b.appendChild(el('p', '', '홈 화면의 싸바카드로 언제든 카드를 만들고, 받은 카드를 모아 볼 수 있어요.'));
    } else if (inKakao) {
      b.appendChild(el('p', '', '카톡 안에서는 홈 화면에 추가할 수 없어요. 아래 버튼으로 ' + (ios ? '사파리' : '크롬') + '에서 연 뒤 설치하세요.'));
      var ex = el('a', 'go', (ios ? '사파리' : '크롬') + '에서 열기'); ex.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.origin + location.pathname + '?install=1'); b.appendChild(ex);
    } else if (ios) {
      b.appendChild(el('p', '', '앱스토어 없이 홈 화면에 바로 추가돼요. 용량도 거의 안 들어요.'));
      var ol = el('ol'); ['아래 주소창 옆 ••• (또는 공유 버튼 □↑)을 누르세요', '"공유" → "홈 화면에 추가"를 누르세요 (안 보이면 아래로 내려서 "더 보기")', '오른쪽 위 "추가"를 누르면 끝!'].forEach(function (t) { ol.appendChild(el('li', '', t)); }); b.appendChild(ol);
    } else {
      b.appendChild(el('p', '', '플레이스토어 없이 홈 화면에 바로 추가돼요. 용량도 거의 안 들어요.'));
      var go = el('button', 'go', deferred ? '📲 지금 설치하기' : '📲 설치하기'); go.type = 'button'; go.id = 'instGo';
      go.addEventListener('click', function () {
        if (deferred) { deferred.prompt(); deferred.userChoice.then(function () { deferred = null; shut(); }); }
        else toast('크롬 메뉴(⋮) → "홈 화면에 추가"를 눌러 주세요');
      });
      b.appendChild(go);
    }
    var later = el('button', 'later', '나중에 할게요'); later.type = 'button'; b.appendChild(later);
    function shut() { w.remove(); try { history.replaceState(null, '', location.pathname); } catch (e) {} }
    later.addEventListener('click', shut);
    w.addEventListener('click', function (e) { if (e.target === w) shut(); });
    w.appendChild(b); document.body.appendChild(w);
  }
  if (wantInstall && !window.SsakaInstall) installSheet();
  window.addEventListener('pageshow', function (e) { if (e.persisted) renderAll(); });
})();
</script>
</body>
</html>
